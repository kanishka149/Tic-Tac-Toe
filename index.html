<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tic Tac Toe</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: white;
            text-align: center;
        }

        .topbar {
            height: 80px;
            background: #3f51b5;
            color: white;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 25px;
        }

        .title {
            font-size: 30px;
            font-weight: bold;
        }

        .menu {
            font-size: 30px;
        }

        .game {
            padding: 40px 15px;
        }

        #status {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 30px;
        }

        .board {
            width: 90vw;
            max-width: 360px;

            margin: auto;

            display: grid;
            grid-template-columns: repeat(3, 1fr);

            gap: 10px;
        }

        .cell {
            height: 110px;

            background: #f5f5f5;

            border: 2px solid #3f51b5;

            border-radius: 8px;

            font-size: 55px;
            font-weight: bold;

            color: #222;

            cursor: pointer;
        }

        .cell:active {
            background: #e8eaf6;
        }

        #reset {
            margin-top: 30px;

            padding: 13px 30px;

            background: #3f51b5;
            color: white;

            border: none;
            border-radius: 6px;

            font-size: 18px;

            cursor: pointer;
        }

    </style>

</head>


<body>

    <!-- HTML PART -->

    <div class="topbar">

        <div class="title">
            Tic Tac Toe
        </div>

        <div class="menu">
            ☰
        </div>

    </div>


    <div class="game">

        <div id="status">
            Player X's Turn
        </div>


        <div class="board">

            <button class="cell"></button>
            <button class="cell"></button>
            <button class="cell"></button>

            <button class="cell"></button>
            <button class="cell"></button>
            <button class="cell"></button>

            <button class="cell"></button>
            <button class="cell"></button>
            <button class="cell"></button>

        </div>


        <button id="reset">
            New Game
        </button>

    </div>


    <!-- JAVASCRIPT PART -->

    <script>

        // Get all 9 buttons
        const cells = document.querySelectorAll(".cell");

        // Get status message
        const status = document.getElementById("status");

        // Get New Game button
        const resetButton = document.getElementById("reset");


        // Store the 9 cells
        let board = [
            "", "", "",
            "", "", "",
            "", "", ""
        ];


        // First player
        let currentPlayer = "X";


        // Game is active
        let gameActive = true;


        // All possible winning combinations
        const winningCombinations = [

            [0, 1, 2],
            [3, 4, 5],
            [6, 7, 8],

            [0, 3, 6],
            [1, 4, 7],
            [2, 5, 8],

            [0, 4, 8],
            [2, 4, 6]

        ];


        // Add click action to every cell
        cells.forEach(function(cell, index) {

            cell.addEventListener("click", function() {


                // Do nothing if game is over
                if (gameActive === false) {
                    return;
                }


                // Do nothing if cell already contains X or O
                if (board[index] !== "") {
                    return;
                }


                // Put X or O in the cell
                board[index] = currentPlayer;

                cell.textContent = currentPlayer;


                // Check whether someone won
                if (hasWinner()) {

                    status.textContent =
                        "Player " + currentPlayer + " Wins!";

                    gameActive = false;

                    return;
                }


                // Check whether the game is a draw
                if (!board.includes("")) {

                    status.textContent =
                        "It's a Draw!";

                    gameActive = false;

                    return;
                }


                // Change player
                if (currentPlayer === "X") {

                    currentPlayer = "O";

                } else {

                    currentPlayer = "X";

                }


                // Display next player's turn
                status.textContent =
                    "Player " + currentPlayer + "'s Turn";

            });

        });


        // Function to check winner
        function hasWinner() {


            // Check all 8 winning combinations
            for (let combination of winningCombinations) {


                let a = combination[0];

                let b = combination[1];

                let c = combination[2];


                if (
                    board[a] !== "" &&
                    board[a] === board[b] &&
                    board[a] === board[c]
                ) {

                    return true;

                }

            }


            return false;

        }


        // New Game button
        resetButton.addEventListener("click", function() {


            // Clear all 9 cells
            board = [
                "", "", "",
                "", "", "",
                "", "", ""
            ];


            // Start with X
            currentPlayer = "X";


            // Activate game
            gameActive = true;


            // Clear the buttons
            cells.forEach(function(cell) {

                cell.textContent = "";

            });


            // Reset status
            status.textContent =
                "Player X's Turn";

        });

    </script>

</body>

</html>
