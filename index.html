<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Tic Tac Toe</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: white;
            font-family: Arial, sans-serif;
        }

        /* Top App Bar */
        .topbar {
            height: 80px;
            background: #3f51b5;
            color: white;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 28px;

            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.3);
        }

        .title {
            font-size: 30px;
            font-weight: bold;
        }

        .menu {
            font-size: 30px;
        }

        /* Game Area */
        .game {
            text-align: center;
            padding: 30px 20px;
        }

        /* Status */
        .status {
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 25px;
        }

        /* Board */
        .board {
            display: grid;

            grid-template-columns: repeat(3, 1fr);

            gap: 10px;

            width: min(90vw, 360px);

            margin: auto;
        }

        /* Cells */
        .cell {
            width: 100%;

            aspect-ratio: 1 / 1;

            border: 2px solid #3f51b5;

            border-radius: 8px;

            background: #f5f5f5;

            font-size: 55px;

            font-weight: bold;

            cursor: pointer;
        }

        .cell:hover {
            background: #e8eaf6;
        }

        /* New Game Button */
        .reset {
            margin-top: 30px;

            padding: 12px 28px;

            border: none;

            border-radius: 6px;

            background: #3f51b5;

            color: white;

            font-size: 18px;

            cursor: pointer;
        }

        .reset:hover {
            background: #303f9f;
        }

    </style>

</head>


<body>

    <!-- Top App Bar -->

    <div class="topbar">

        <div class="title">
            Tic Tac Toe
        </div>

        <div class="menu">
            ☰
        </div>

    </div>


    <!-- Game Area -->

    <div class="game">

        <div class="status" id="status">
            Player X's Turn
        </div>


        <!-- Tic Tac Toe Board -->

        <div class="board">

            <button class="cell"
                    onclick="makeMove(0)">
            </button>

            <button class="cell"
                    onclick="makeMove(1)">
            </button>

            <button class="cell"
                    onclick="makeMove(2)">
            </button>


            <button class="cell"
                    onclick="makeMove(3)">
            </button>

            <button class="cell"
                    onclick="makeMove(4)">
            </button>

            <button class="cell"
                    onclick="makeMove(5)">
            </button>


            <button class="cell"
                    onclick="makeMove(6)">
            </button>

            <button class="cell"
                    onclick="makeMove(7)">
            </button>

            <button class="cell"
                    onclick="makeMove(8)">
            </button>

        </div>


        <!-- New Game Button -->

        <button class="reset"
                onclick="resetGame()">

            New Game

        </button>

    </div>

        ];
