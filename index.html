<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tic Tac Toe</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: white;
        }

        .topbar {
            height: 80px;
            background: #3f51b5;
            color: white;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 25px;

            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }

        .title {
            font-size: 30px;
            font-weight: bold;
        }

        .menu {
            font-size: 32px;
        }

        .game {
            text-align: center;
            padding: 40px 15px;
        }

        #status {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 30px;
        }

        .board {
            width: 90vw;
            max-width: 360px;

            margin: auto;

            display: grid;
            grid-template-columns: repeat(3, 1fr);

            gap: 10px;
        }

        .cell {
            height: 110px;

            background: #f5f5f5;

            border: 2px solid #3f51b5;

            border-radius: 8px;

            font-size: 55px;
            font-weight: bold;

            color: #222;

            cursor: pointer;

            -webkit-tap-highlight-color: transparent;
        }

        .cell:active {
            background: #e8eaf6;
        }

        #reset {
            margin-top: 30px;

            padding: 13px 30px;

            background: #3f51b5;
            color: white;

            border: none;
            border-radius: 6px;

            font-size: 18px;

            cursor: pointer;
        }
    </style>
</head>

<body>

    <div class="topbar">
        <div class="title">Tic Tac Toe</div>
        <div class="menu">☰</div>
    </div>

    <div class="game">

        <div id="status">Player X's Turn</div>

        <div class="board">

            <button class="cell"></button>
            <button class="cell"></button>
            <button class="cell"></button>

            <button class="cell"></button>
            <button class="cell"></button>
            <button class="cell"></button>

            <button class="cell"></button>
            <button class="cell"></button>
            <button class="cell"></button>

        </div>

        <button id="reset">New Game</button>

    </div>


    <script>

        // Get all cells
        const cells = document.querySelectorAll(".cell");

        // Get status text
        const status = document.getElementById("status");

        // Get reset button
        const resetButton = document.getElementById("reset");

        // Store the game
        let board = ["", "", "", "", "", "", "", "", ""];

        // First player
        let currentPlayer = "X";

        // Game status
        let gameActive = true;


        // Winning combinations
        const winningCombinations = [
            [0, 1, 2],
            [3, 4, 5],
            [6, 7, 8],

            [0, 3, 6],
            [1, 4, 7],
            [2, 5, 8],

            [0, 4, 8],
            [2, 4, 6]
        ];


        // Add click event to every cell
        cells.forEach(function(cell, index) {

            cell.addEventListener("click", function() {

                // Stop if game is over
                if (!gameActive) {
                    return;
                }

                // Stop if cell is already filled
                if (board[index] !== "") {
                    return;
                }

                // Put X or O
                board[index] = currentPlayer;

                cell.textContent = currentPlayer;


                // Check winner
                if (hasWinner()) {

                    status.textContent =
                        "Player " + currentPlayer + " Wins!";

                    gameActive = false;

                    return;
                }


                // Check draw
                if (!board.includes("")) {

                    status.textContent = "It's a Draw!";

                    gameActive = false;

                    return;
                }


                // Change player
                if (currentPlayer === "X") {
                    currentPlayer = "O";
                } else {
                    currentPlayer = "X";
                }


                // Update message
                status.textContent =
                    "Player " + currentPlayer + "'s Turn";

            });

        });


        // Check winning combinations
        function hasWinner() {

            for (let combination of winningCombinations) {

                let a = combination[0];
                let b = combination[1];
                let c = combination[2];

                if (
                    board[a] !== "" &&
                    board[a] === board[b] &&
                    board[a] === board[c]
                ) {
                    return true;
                }
            }

            return false;
        }


        // New Game button
        resetButton.addEventListener("click", function() {

            // Clear board
            board = ["", "", "", "", "", "", "", "", ""];

            // Start with X
            currentPlayer = "X";

            // Activate game
            gameActive = true;

            // Clear cells
            cells.forEach(function(cell) {
                cell.textContent = "";
            });

            // Reset message
            status.textContent = "Player X's Turn";

        });

    </script>

</body>
</html>
